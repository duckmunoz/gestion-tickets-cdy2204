
name: CI/CD Gestion de Tickets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gestion-tickets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar, probar y publicar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify

      - name: Configurar Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            duckmoonoz/ms-administracion-archivos:latest
            duckmoonoz/ms-administracion-archivos:${{ github.sha }}

  verificar-ec2:
    name: Verificar acceso SSH a EC2
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Instalar clave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Comprobar identidad del servidor
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh-keygen -F "$EC2_HOST" -f ~/.ssh/known_hosts > /dev/null

      - name: Probar conexion SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "echo SSH_OK && sudo -n docker --version"

  deploy:
    name: Desplegar automaticamente en EC2
    needs: [build, verificar-ec2]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Instalar clave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar nueva imagen
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: duckmoonoz/ms-administracion-archivos:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'EOF'
          set -euo pipefail

          NAME="gestion-tickets"
          ENV_FILE="/home/ec2-user/aws-s3.env"
          DATA_DIR="/mnt/efs/tickets"

          echo "Verificando configuracion..."

          test -f "$ENV_FILE"

          if ! mountpoint -q /mnt/efs; then
            echo "ERROR: Amazon EFS no esta montado"
            exit 1
          fi

          if ! findmnt -n -o FSTYPE /mnt/efs | grep -qx nfs4; then
            echo "ERROR: El montaje no corresponde a NFS4"
            exit 1
          fi

          if ! findmnt -n -o SOURCE /mnt/efs | grep -q 'fs-06e00b7c89287c88c'; then
            echo "ERROR: No esta montado el EFS esperado"
            exit 1
          fi

          if [ ! -d "$DATA_DIR" ]; then
            echo "ERROR: No existe el directorio de tickets en EFS"
            exit 1
          fi

          echo "Amazon EFS verificado correctamente."

          echo "Descargando nueva imagen..."
          sudo -n docker pull "$IMAGE"

          echo "Preparando contenedor anterior..."

          if sudo -n docker container inspect "${NAME}-anterior" >/dev/null 2>&1; then
            echo "ERROR: Existe un contenedor de respaldo anterior."
            echo "Revisarlo antes de continuar."
            exit 1
          fi

          if sudo -n docker container inspect "$NAME" >/dev/null 2>&1; then
            sudo -n docker stop "$NAME"
            sudo -n docker rename "$NAME" "${NAME}-anterior"
          fi

          restaurar_anterior() {
            echo "Restaurando version anterior..."
            sudo -n docker rm -f "$NAME" 2>/dev/null || true

            if sudo -n docker container inspect "${NAME}-anterior" >/dev/null 2>&1; then
              sudo -n docker rename "${NAME}-anterior" "$NAME"
              sudo -n docker start "$NAME"
            fi
          }

          echo "Iniciando nueva version..."

          if ! sudo -n docker run -d \
            --name "$NAME" \
            --restart unless-stopped \
            -p 8080:8080 \
            --env-file "$ENV_FILE" \
            --mount "type=bind,source=$DATA_DIR,target=/app/tickets-local" \
            "$IMAGE"; then
            echo "Fallo al iniciar el contenedor."
            restaurar_anterior
            exit 1
          fi

          echo "Comprobando API..."
          HEALTH_OK=false

          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 \
              http://127.0.0.1:8080/api/tickets/estadisticas \
              -o /dev/null; then
              HEALTH_OK=true
              break
            fi
            sleep 3
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "La API no responde. Restaurando version anterior."
            sudo -n docker logs --tail 40 "$NAME" || true
            restaurar_anterior
            exit 1
          fi

          echo "Verificando volumen Docker..."

          MOUNT_SOURCE=$(sudo -n docker inspect \
            --format '{{range .Mounts}}{{if eq .Destination "/app/tickets-local"}}{{.Source}}{{end}}{{end}}' \
            "$NAME")

          if [ "$MOUNT_SOURCE" != "$DATA_DIR" ]; then
            echo "ERROR: Docker no utiliza el directorio EFS esperado."
            restaurar_anterior
            exit 1
          fi

          echo "Despliegue verificado correctamente."
          echo "Amazon EFS conectado a Docker."

          sudo -n docker rm -f "${NAME}-anterior" 2>/dev/null || true
          sudo -n docker ps --filter "name=^/${NAME}$"
          EOF
